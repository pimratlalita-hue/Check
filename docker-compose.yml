services:
  # ==========================================
  # Database Service: MySQL 8.4 LTS
  # ==========================================
  db:
    image: mysql:8.4
    container_name: gtmts-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootPassw0rd_Secure!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ums_dev}
      MYSQL_USER: ${MYSQL_USER:-gtmts_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gtmts_secure_pass}
    ports:
      # Map container 3306 to host 3307 to prevent collision with host's native mysqld
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - gtmts_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    networks:
      - gtmts_net

  # ==========================================
  # Web Application Service: Next.js GTMTS
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gtmts-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3010}:3010"
    environment:
      NODE_ENV: production
      PORT: 3010
      DATABASE_URL: mysql://${MYSQL_USER:-gtmts_user}:${MYSQL_PASSWORD:-gtmts_secure_pass}@db:3306/${MYSQL_DATABASE:-ums_dev}
      AUTH_SECRET: ${AUTH_SECRET:-e8f23b9d8819a843f5b72183c5e8c14a2f8b90123456789abcdef0123456}
      APP_URL: ${APP_URL:-http://localhost:3010}
      AUTH_URL: ${AUTH_URL:-http://localhost:3010}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3010}
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SEED_ALLOW_PROD: "1"
      SEED_ON_INIT: ${SEED_ON_INIT:-1}
    networks:
      - gtmts_net

# ==========================================
# Named Persistent Storage & Network
# ==========================================
volumes:
  gtmts_mysql_data:
    driver: local

networks:
  gtmts_net:
    driver: bridge
